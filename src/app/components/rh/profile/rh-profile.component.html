	<div *ngIf="message" class="notif-message" [ngClass]="messageType">
		{{ message }}
	</div>
<div class="profile-container">
	<div class="profile-header">
		<span class="material-icons profile-icon">badge</span>
		<h2>Mon profil RH</h2>
		<p class="profile-role">{{ user?.role | uppercase }}</p>
	</div>
		<div class="profile-card">
			<form class="profile-info" autocomplete="off">
						<div class="profile-row">
							<label class="label" for="nom">Nom :</label>
							<input id="nom" type="text" [(ngModel)]="nom" [disabled]="!editMode" class="profile-input" name="nom" />
						</div>
						<div class="profile-row">
							<label class="label" for="prenom">Prénom :</label>
							<input id="prenom" type="text" [(ngModel)]="prenom" [disabled]="!editMode" class="profile-input" name="prenom" />
						</div>
						<div class="profile-row">
							<label class="label" for="email">Email :</label>
							<input id="email" type="email" [(ngModel)]="email" [disabled]="true" class="profile-input" name="email" />
						</div>
						<div class="profile-row">
							<label class="label" for="tel">Téléphone :</label>
							<input id="tel" type="text" [(ngModel)]="numero_telephone" [disabled]="!editMode" class="profile-input" name="numero_telephone" />
						</div>
						<div class="profile-row" *ngIf="editMode">
							<label class="label" for="password">Mot de passe :</label>
							<input id="password" type="password" [(ngModel)]="password" required class="profile-input" placeholder="Entrez votre mot de passe" name="password" />
						</div>
			</form>
			<div class="profile-actions">
				<button class="edit-btn" type="button" (click)="toggleEditMode()">
					<span class="material-icons">{{ editMode ? 'save' : 'edit' }}</span>
					{{ editMode ? 'Enregistrer' : 'Modifier mon profil' }}
				</button>
			</div>
		</div>
</div>
