<nav class="rh-navbar">
  <div class="navbar-container">
    <!-- Logo/Titre de l'application -->
    <div class="navbar-brand">
      <span class="material-icons">business</span>
      <h1>Gestion RH</h1>
    </div>

    <!-- Barre de recherche -->
    <div class="search-container">
      <div class="search-box">
        <span class="material-icons search-icon">search</span>
        <input 
          type="text" 
          placeholder="Rechercher des offres, candidats..."
          [(ngModel)]="searchTerm"
          (input)="onSearchInput()"
          (keydown.enter)="onSearch()"
          class="search-input">
        <button 
          *ngIf="searchTerm" 
          class="clear-btn" 
          (click)="clearSearch()"
          type="button">
          <span class="material-icons">clear</span>
        </button>
      </div>
    </div>

    <!-- Menu de profil -->
    <div class="profile-container">
      <div class="profile-menu" (click)="toggleProfileMenu()">
        <div class="profile-avatar">
          {{ getUserInitials() }}
        </div>
        <div class="profile-info">
          <span class="profile-name">{{ getUserFullName() }}</span>
          <span class="profile-role">{{ getUserRole() }}</span>
        </div>
        <span class="material-icons dropdown-icon" [class.rotated]="showProfileMenu">
          keyboard_arrow_down
        </span>
      </div>

      <!-- Menu déroulant -->
      <div class="dropdown-menu" [class.show]="showProfileMenu" (click)="closeProfileMenu()">
        <div class="dropdown-overlay" (click)="closeProfileMenu()"></div>
        <div class="dropdown-content">
          <div class="dropdown-header">
            <div class="profile-avatar-large">
              {{ getUserInitials() }}
            </div>
            <div class="profile-details">
              <h3>{{ getUserFullName() }}</h3>
              <p>{{ currentUser?.email || 'Email non disponible' }}</p>
            </div>
          </div>
          
          <div class="dropdown-divider"></div>
          
          <div class="dropdown-items">
            <button class="dropdown-item" (click)="navigateToProfile()">
              <span class="material-icons">person</span>
              <span>Mon Profil</span>
            </button>
            
            <button class="dropdown-item" (click)="logout()">
              <span class="material-icons">logout</span>
              <span>Déconnexion</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>
